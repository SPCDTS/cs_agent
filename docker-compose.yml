services:
  cs-agent:
    depends_on: [napcat]
    build: .
    image: cs-agent:dev
    container_name: cs-agent
    env_file:
      - path: .env
        required: false
    environment:
      HEALTH_HOST: 0.0.0.0
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
    ports: ["127.0.0.1:8787:8787"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
      - ${SKILLS_DIR:-./data/skills}:/data/skills:ro
      - ${SKILLS_DIR:-./data/skills}:/data/codex/skills/shared:ro
    user: "node"
    # codex 的 bwrap 命令沙箱需要非特权用户命名空间，而 Docker 默认 seccomp 配置阻止 CLONE_NEWUSER，
    # 导致 codex 在容器内无法执行任何命令。这里使用"默认配置 + 仅放开命名空间/挂载相关系统调用"的
    # 自定义 profile（docker/seccomp-codex.json），其余与 Docker 默认完全一致。用户 2026-10-18 选定方案。
    security_opt:
      - seccomp=./docker/seccomp-codex.json
    restart: unless-stopped
    init: false   # 镜像内已用 tini
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    # 2026-10-19 的 latest index digest；更新时改 digest。
    image: mlikiowa/napcat-docker@sha256:f611790ecffa23c3c182017d5cf68179dc24612403608cd835ad13d79642f1bd
    container_name: napcat
    restart: unless-stopped
    mac_address: 02:42:ac:11:00:02
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN}
      ACCOUNT: ${QQ_BOT_ACCOUNT:-}
    ports: ["127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"]
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    healthcheck:
      # 官方 base/Dockerfile 安装 curl，未声明 wget；这里只检查 WebUI，不代表 QQ 已登录。
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://127.0.0.1:6099/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
