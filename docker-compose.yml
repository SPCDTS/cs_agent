services:
  cs-agent:
    depends_on: [napcat]
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-}
    image: cs-agent:dev
    container_name: cs-agent
    env_file:
      - path: .env
        required: false
    environment:
      HEALTH_HOST: 0.0.0.0
      # 容器时区：面板时间显示、每日任务小时、codex/pi 沙箱里的 date 都按它；留空用 Asia/Shanghai
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      WORKSPACE_DIR: /workspace
    networks: [default, internal]
    ports: ["127.0.0.1:8787:8787"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
      - ${SKILLS_DIR:-./data/skills}:/data/skills
      - ${SKILLS_DIR:-./data/skills}:/data/codex/skills/shared
    user: "node"
    # codex 的 bwrap 命令沙箱需要非特权用户命名空间，而 Docker 默认 seccomp 配置阻止 CLONE_NEWUSER，
    # 导致 codex 在容器内无法执行任何命令。这里使用"默认配置 + 仅放开命名空间/挂载相关系统调用"的
    # 自定义 profile（docker/seccomp-codex.json），其余与 Docker 默认完全一致。用户 2026-10-18 选定方案。
    security_opt:
      - seccomp=./docker/seccomp-codex.json
    restart: unless-stopped
    init: false   # 镜像内已用 tini
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gmail-sidecar:
    profiles: ["gmail"]
    # 与 cs-agent 共用镜像；先 docker compose build cs-agent，避免重复构建。
    image: cs-agent:dev
    entrypoint: ["tini", "--", "node", "dist/sidecar/gmail/main.js"]
    user: node
    environment:
      GMAIL_SIDECAR_TOKEN: ${GMAIL_SIDECAR_TOKEN:-}
    volumes:
      - ./secrets/gmail:/secrets/gmail
      # token 刷新需写目录，桌面客户端身份单独覆盖为只读。
      - ./secrets/gmail/client.json:/secrets/gmail/client.json:ro
      - ./data/gmail-sidecar:/state
    networks:
      internal:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3731/healthz').then(async r=>process.exit(r.ok&&(await r.json()).ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  napcat:
    # 2026-10-19 的 latest index digest；更新时改 digest。
    image: mlikiowa/napcat-docker@sha256:f611790ecffa23c3c182017d5cf68179dc24612403608cd835ad13d79642f1bd
    container_name: napcat
    restart: unless-stopped
    mac_address: 02:42:ac:11:00:02
    environment:
      NAPCAT_UID: "1000"
      NAPCAT_GID: "1000"
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN}
      ACCOUNT: ${QQ_BOT_ACCOUNT:-}
    ports: ["127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"]
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
    healthcheck:
      # 官方 base/Dockerfile 安装 curl，未声明 wget；这里只检查 WebUI，不代表 QQ 已登录。
      test: ["CMD-SHELL", "curl -fsS --max-time 4 http://127.0.0.1:6099/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  datasette:
    # 只读浏览各 SQLite 库；无登录，只绑本机。pi-durable 的文档存为基础版本 + 增量，这里只能看到原始 JSON。
    build: { context: ., dockerfile: docker/datasette.Dockerfile }
    image: cs-datasette:0.65.1
    container_name: datasette
    restart: unless-stopped
    ports: ["127.0.0.1:${DATASETTE_PORT:-8001}:8001"]
    volumes:
      - ./data:/data:ro
    command: >-
      datasette serve -h 0.0.0.0 -p 8001
      /data/observability.sqlite /data/qq-messages.sqlite /data/qq-bridge.sqlite
      /data/memory.sqlite /data/agent.sqlite /data/pi.sqlite
      --setting sql_time_limit_ms 5000 --setting max_returned_rows 1000

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
