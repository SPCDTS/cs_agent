name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # test/agent/pi.test.ts 在 linux 上按"容器里有 bwrap"断言 bash 工具可用，运行器也要装 bubblewrap
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=dot

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pi-sandbox-linux 用 bubblewrap；Ubuntu 24.04 默认禁止非特权用户命名空间，放开后 bwrap 才能起
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run test:integration -- --reporter=dot

  # Workers 部署：main 上两组测试都过且仓库里有 wrangler.jsonc 时才跑（P0 之前没有这个文件，各步跳过）。
  # hashFiles() 不能用在作业级 if 里，所以文件检查放在第一步，后续步骤按它的输出决定。
  # 密钥 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 在仓库 Settings → Secrets；本机 Docker 部署仍走 scripts/deploy.ps1。
  deploy-workers:
    name: deploy workers
    needs: [check, integration]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: workers
    concurrency:
      group: deploy-workers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        run: echo "present=$([ -f wrangler.jsonc ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.cfg.outputs.present == 'true'
        run: npm ci
      - if: steps.cfg.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
