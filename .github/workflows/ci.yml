name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs

  workers-tests:
    name: workers tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm run install:workers
      # 包含类型检查、workerd 测试、所有独立 Node 测试及不发布的打包检查。
      - run: npm run check

  check:
    name: workers check
    needs: [workers-tests, changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require relevant checks
        env:
          WORKERS_RESULT: ${{ needs.workers-tests.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE_CHANGED" = true ]; then
            test "$WORKERS_RESULT" = success
          else
            test "$WORKERS_RESULT" = skipped
          fi

  deploy-workers:
    name: deploy workers
    needs: [check, changes]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.changes.outputs.code == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: workers
    concurrency:
      group: deploy-workers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm run install:workers
      - run: node scripts/deploy.mjs deployments/production.json --prepare-for-deploy
        working-directory: workers
        env:
          DEVICE_CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.DEVICE_CLOUDFLARE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # coding 沙箱仍由 Wrangler 构建并推送到 Cloudflare；不再部署旧的常驻 Node 容器。
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.deploy.json --var CS_AGENT_COMMIT:${{ github.sha }}
