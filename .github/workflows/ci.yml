name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs

  workers-tests:
    name: workers tests
    needs: native-changes
    if: needs.native-changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            workers/package-lock.json
            runner/package-lock.json
      - run: npm --prefix workers ci
      - if: needs.native-changes.outputs.changed == 'true'
        run: npm --prefix runner ci
      # 包含类型检查、测试卫生门禁、Vitest（附耗时摘要与红线）、独立 Node 测试及不发布的打包检查。
      - run: npm --prefix workers run typecheck
      - run: python3 -B -m unittest discover -s deploy/cua/ci
      - run: npm run test:ci
      - name: Run Vitest suite
        shell: bash
        run: npm --prefix workers test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"
      - name: Check Vitest duration budget & summary
        if: "!cancelled()"
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/vitest-report.json" ]; then
            node scripts/ci-vitest-summary.mjs "$RUNNER_TEMP/vitest-report.json"
          fi
      - run: npm --prefix workers run test:node
      - run: npm --prefix workers run build
      - if: needs.native-changes.outputs.changed == 'true'
        run: npm --prefix runner run typecheck && npm --prefix runner test && npm --prefix runner run build

  runner-native:
    name: windows WSB runner
    needs: native-changes
    if: needs.native-changes.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm --prefix runner ci
      - run: npm --prefix runner run typecheck
      - run: npm --prefix runner run build
      - run: npm --prefix runner test

  check:
    name: workers check
    needs: [workers-tests, native-changes, runner-native]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require relevant checks
        env:
          WORKERS_RESULT: ${{ needs.workers-tests.result }}
          CODE_CHANGED: ${{ needs.native-changes.outputs.code }}
          CHANGES_RESULT: ${{ needs.native-changes.result }}
          NATIVE_RESULT: ${{ needs.runner-native.result }}
          NATIVE_CHANGED: ${{ needs.native-changes.outputs.changed }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$CODE_CHANGED" = true ]; then
            test "$WORKERS_RESULT" = success
          else
            test "$WORKERS_RESULT" = skipped
          fi
          if [ "$NATIVE_CHANGED" = true ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi

  deploy-workers:
    name: deploy workers
    needs: [check, native-changes]
    # 原生测试允许按变更跳过；显式状态函数避免其 skipped 状态继续阻断部署。
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.native-changes.outputs.code == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: workers
    concurrency:
      group: deploy-workers
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm --prefix workers ci
      - run: node scripts/deploy.mjs deployments/production.json --prepare-for-deploy
        working-directory: workers
        env:
          DEVICE_CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.DEVICE_CLOUDFLARE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # coding 沙箱仍由 Wrangler 构建并推送到 Cloudflare；不再部署旧的常驻 Node 容器。
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers
          command: deploy --config wrangler.deploy.json --var JOULE_COMMIT:${{ github.sha }}

  deploy-vps:
    name: deploy Cua VPS
    needs: [check, deploy-workers]
    if: >-
      ${{ !cancelled() && needs.check.result == 'success' &&
          (needs.deploy-workers.result == 'success' || needs.deploy-workers.result == 'skipped') &&
          github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: vps
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm --prefix runner ci && npm --prefix runner run build:cua
      - name: Stage bridge and service
        run: |
          mkdir "$RUNNER_TEMP/cua-vps"
          cp runner/dist/reverse-mcp-bridge.cjs deploy/cua/cua-directory-bridge.service "$RUNNER_TEMP/cua-vps/"
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cua-vps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cua-vps/
          if-no-files-found: error
          retention-days: 7
      - name: Deliver verified archive and wait for bridge registration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          staging=$(mktemp -d)
          trap 'rm -rf -- "$staging"' EXIT
          [[ "$VPS_HOST" =~ ^[[:alnum:]][[:alnum:].:-]*$ && "$VPS_PORT" =~ ^[0-9]{1,5}$ && "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$staging/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$staging/known_hosts"
          ready=0
          for attempt in $(seq 1 12); do
            rm -f "$staging/bridge.zip"
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$staging/bridge.zip" \
              && [[ -s "$staging/bridge.zip" ]] \
              && digest=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.digest') \
              && [[ "$digest" == "sha256:$(sha256sum "$staging/bridge.zip" | awk '{print $1}')" ]]; then
              ready=1
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              echo "Waiting for artifact $ARTIFACT_ID to become downloadable (attempt $attempt/12)..." >&2
              sleep 3
            fi
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "Artifact $ARTIFACT_ID did not become downloadable via GitHub API in time." >&2
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '{id,name,expired,digest}' >&2 || true
            exit 1
          fi
          ssh -F /dev/null -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile="$staging/known_hosts" -o HostKeyAlias=cua-vps \
            -o ConnectTimeout=12 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            -i "$staging/key" -p "$VPS_PORT" "cua-deploy@$VPS_HOST" "deploy $ARTIFACT_ID" < "$staging/bridge.zip"
