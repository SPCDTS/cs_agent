<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded avatar frame (alma.now style character badge) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#141514" stroke="#3B3B36" stroke-width="2"/>
  <!-- Soft warm radial halo behind Joule -->
  <circle cx="32" cy="33" r="23" fill="#1E201D"/>

  <!-- Joule's messy, energetic tousled hair (back & spiky side tufts) -->
  <path d="M12 28C8 24 7 17 13 15C14 10 21 6 32 6C43 6 50 10 51 15C57 17 56 24 52 28C56 33 55 41 49 43L46 36H18L15 43C9 41 8 33 12 28Z" fill="#E04F33" stroke="#141514" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Spiky side pigtails / hair tufts -->
  <path d="M11 26L5 23L9 32L6 36L13 37Z" fill="#E04F33"/>
  <path d="M53 26L59 23L55 32L58 36L51 37Z" fill="#E04F33"/>

  <!-- Pilot flight jacket high collar & scarf -->
  <path d="M14 58L18 46L26 49H38L46 46L50 58H14Z" fill="#252825" stroke="#E6E5DE" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Mechanic scarf / core clasp at neck -->
  <polygon points="32,48 37,53 32,58 27,53" fill="#FF5A36" stroke="#141514" stroke-width="1.4"/>
  <circle cx="32" cy="53" r="1.8" fill="#F3F2EC"/>

  <!-- Joule's face & ears -->
  <circle cx="16" cy="34" r="3.2" fill="#F3EAD8" stroke="#141514" stroke-width="1.6"/>
  <circle cx="48" cy="34" r="3.2" fill="#F3EAD8" stroke="#141514" stroke-width="1.6"/>
  <path d="M18 24H46V35C46 43 39.5 48.5 32 48.5C24.5 48.5 18 43 18 35V24Z" fill="#F3EAD8" stroke="#141514" stroke-width="1.8"/>

  <!-- Tousled front bangs peeking under goggles -->
  <path d="M16 25C18 21 23 21 25 27L28 22L32 28L36 22L39 27C41 21 46 21 48 25L46 19H18L16 25Z" fill="#FF6B4A" stroke="#141514" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Side hair locks framing cheeks -->
  <path d="M17 25L15 39L20 36L19 26Z" fill="#E04F33" stroke="#141514" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M47 25L49 39L44 36L45 26Z" fill="#E04F33" stroke="#141514" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Joule's expressive anime eyes -->
  <!-- Left eye -->
  <path d="M21.5 32.5C23 31 26.5 31 28 32.5" stroke="#141514" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="25" cy="34.8" rx="2.6" ry="3" fill="#141514"/>
  <circle cx="25.3" cy="35.2" r="1.5" fill="#0D7148"/>
  <circle cx="24.2" cy="33.8" r="1" fill="#FFFFFF"/>
  <!-- Right eye -->
  <path d="M36 32.5C37.5 31 41 31 42.5 32.5" stroke="#141514" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="39" cy="34.8" rx="2.6" ry="3" fill="#141514"/>
  <circle cx="38.7" cy="35.2" r="1.5" fill="#0D7148"/>
  <circle cx="37.8" cy="33.8" r="1" fill="#FFFFFF"/>

  <!-- Cute tinkerer cheek bandage / grease mark & confident grin -->
  <rect x="40.5" y="38.2" width="4.2" height="2.2" rx="0.8" transform="rotate(-10 40.5 38.2)" fill="#E04F33" opacity="0.85"/>
  <path d="M28.5 41.5C30.5 43.6 34.2 43.5 36.2 41.2" stroke="#141514" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Signature oversized aviator / mechanic goggles perched on forehead -->
  <!-- Goggle strap -->
  <path d="M13 18H51" stroke="#141514" stroke-width="4" stroke-linecap="round"/>
  <path d="M29 17.5H35" stroke="#B4B2A6" stroke-width="3"/>
  <!-- Left goggle rim & glowing emerald-cyan lens -->
  <circle cx="23" cy="17.5" r="7.2" fill="#2A2D2A" stroke="#141514" stroke-width="1.8"/>
  <circle cx="23" cy="17.5" r="5.2" fill="#0D7148" stroke="#E6E5DE" stroke-width="1.2"/>
  <path d="M20 15.5L24.5 14C26 14.8 26.5 16 26 17.5L20 15.5Z" fill="#6FE0A0"/>
  <circle cx="21" cy="15.5" r="1.1" fill="#FFFFFF"/>
  <!-- Right goggle rim & glowing emerald-cyan lens -->
  <circle cx="41" cy="17.5" r="7.2" fill="#2A2D2A" stroke="#141514" stroke-width="1.8"/>
  <circle cx="41" cy="17.5" r="5.2" fill="#0D7148" stroke="#E6E5DE" stroke-width="1.2"/>
  <path d="M38 15.5L42.5 14C44 14.8 44.5 16 44 17.5L38 15.5Z" fill="#6FE0A0"/>
  <circle cx="39" cy="15.5" r="1.1" fill="#FFFFFF"/>
</svg>
